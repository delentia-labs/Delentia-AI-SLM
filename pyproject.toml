[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delentia-ai"
version = "0.1.0-alpha"
description = "SLM Fine-tuning Factory for Delentia OS — Constitutional AI with JITNA v3 & FDIA compliance"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Delentia Labs", email = "infra@delentia.com" }]
requires-python = ">=3.11"
keywords = [
  "llm", "fine-tuning", "constitutional-ai", "thai-llm",
  "jitna", "fdia", "intent-loop", "rct", "delentia"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "unsloth[colab-new]>=2024.6",
  "transformers>=4.42",
  "datasets>=2.19",
  "mlflow>=2.13",
  "delentia-os>=2.0.0",
  "peft>=0.11",
  "trl>=0.9",
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "pythainlp>=5.0",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
delentia-train = "training.finetune:main"
delentia-eval  = "training.evaluate:main"
delentia-export = "training.export_gguf:main"

[project.urls]
Repository = "https://github.com/delentia-labs/delentia-ai"
"Hugging Face" = "https://huggingface.co/delentia-labs/delentia-slm-jitna-v0.1"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
